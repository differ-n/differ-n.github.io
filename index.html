<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tri Wibowo – 3D Animator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Alegreya:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#eceaff;--mute:#b3b8e6;--line:#aebaff;--gold:#e9c779;--amber:#f0c878;--rose:#e0415f;--deep:#090b26;
  --serif:"Cinzel Decorative","Cinzel",Georgia,serif;--ui:"Cinzel",Georgia,serif;--body:"Alegreya",Georgia,serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0a0b1e;color:var(--ink);font:400 17px/1.55 var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

/* ===== KAMAR ===== */
.room{position:fixed;inset:0;overflow:hidden}
.stage{position:absolute;left:0;top:0;
  transition:transform 1s cubic-bezier(.65,0,.35,1),filter 1s;will-change:transform}
.stage.zoom{filter:brightness(1.7) saturate(.8)}
.pl{position:absolute;inset:0;transform:translate(var(--px,0),var(--py,0)) scale(1.03);transition:transform .35s ease-out}
.pl img{display:block;width:100%;height:100%}
.sky{position:absolute;left:32.13%;top:7.5%;width:41.83%;height:36.29%;mix-blend-mode:screen;pointer-events:none}
.hot{position:absolute;left:37.8%;top:43.9%;width:24.45%;height:24.92%;border-radius:3px;cursor:pointer;box-shadow:0 0 0 0 #8fa6ff00;
  transition:box-shadow .3s,background .3s;animation:pulse 2.6s ease-in-out infinite}
.hot:hover,.hot:focus-visible{animation:none;outline:none;box-shadow:0 0 60px 22px #e6ecffee,0 0 170px 80px #8fa6ff77}
.scr{position:absolute;overflow:hidden;container-type:inline-size;display:grid;place-items:center;opacity:0;transition:opacity .55s;
  background:radial-gradient(ellipse at 50% 45%,#fff,#fff 60%,#eef3ff)}
.scr b{position:relative;z-index:1;font:700 11cqw/1 var(--serif);letter-spacing:.14em;text-transform:uppercase;color:#1a2a7a;text-shadow:0 0 14px #fff,0 2px 0 #fff8;opacity:0;scale:.92;transition:opacity .45s .1s,scale .45s .1s;white-space:nowrap}
.scr b::before,.scr b::after{content:"";display:inline-block;width:2.2cqw;height:2.2cqw;rotate:45deg;background:#c9a24a;margin:0 3.5cqw;vertical-align:middle;box-shadow:0 0 8px #e9c779}
.hot:hover .scr,.hot:focus-visible .scr,.room.go .scr{opacity:1}
.hot:hover .scr b,.hot:focus-visible .scr b{opacity:1;scale:1}
@media (hover:none){.scr{opacity:1;background:none}.scr b{opacity:1;scale:1;color:#cfe0ff;text-shadow:0 0 14px #6f8dff}
  .room.go .scr{background:radial-gradient(ellipse at 50% 45%,#fff,#fff 60%,#eef3ff)}}
.room.go .scr b{opacity:0!important;transition:none!important}
@keyframes pulse{50%{box-shadow:0 0 30px 6px #8fa6ff66}}
.sp{position:absolute;border-radius:12px;cursor:pointer;transition:box-shadow .25s,background .25s}
.sp:hover,.sp:focus-visible{outline:none;background:#ffe6a818;box-shadow:0 0 26px 4px #ffd98a66}
.say{position:absolute;transform:translateX(-50%);background:#0d1236ee;border:1px solid #e9c77999;padding:4px 14px;border-radius:999px;
  font-size:clamp(12px,1.25vw,16px);white-space:nowrap;pointer-events:none;z-index:3;animation:up 2.6s ease-out forwards}
@keyframes up{0%{opacity:0;margin-top:10px}12%,80%{opacity:1}100%{opacity:0;margin-top:-26px}}
.pt{position:absolute;width:9px;height:12px;border-radius:60% 40% 60% 40%;background:var(--rose);pointer-events:none;z-index:3;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),22vh) rotate(260deg);opacity:0}}
.cap{position:absolute;left:0;right:0;bottom:2.5vh;text-align:center;z-index:2;pointer-events:none;color:#d6dbff;font:700 12px var(--ui);letter-spacing:.24em;text-shadow:0 1px 6px #000;transition:opacity .4s}
.cap small{display:block;font:500 15px var(--body);opacity:.75;letter-spacing:.04em;margin-top:2px}
.room.in .cap{opacity:0}

/* ===== LOBBY ===== */
.lobby{position:fixed;inset:0;z-index:5;background:var(--deep);opacity:0;pointer-events:none;transition:opacity .6s;overflow:hidden}
.lobby.on{opacity:1;pointer-events:auto}
.bg{position:absolute;inset:-20px;background:var(--room) 61% 21%/240% auto no-repeat;filter:blur(4px) brightness(.95) saturate(1.3)}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#080a22dd,#0a0d2a55 30%,#0a0d2a55 70%,#080a22dd)}
.fog{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,#5a5fe055,transparent 38%)}
.stars{position:absolute;inset:0;width:100%;height:100%}
.scene{--sw:min(1640px,94vw);position:absolute;left:50%;top:0;bottom:0;width:var(--sw);translate:-50% 0}
.chw{position:absolute;left:0;bottom:0;aspect-ratio:var(--ar);height:min(94vh,calc(var(--sw) * .66 / var(--ar)));translate:var(--lx,0px) var(--ly,0px);transition:translate .4s ease-out}
.glow{position:absolute;left:50%;top:48%;width:150%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#7b86ff77,#4a3fd044 42%,transparent 68%)}
.bob{position:absolute;inset:0;animation:bob 5s ease-in-out infinite}
.chw img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 30px #7f8bffaa)}
.orb{position:absolute;width:30%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;mix-blend-mode:screen;pointer-events:none;animation:orb 3s ease-in-out infinite}
.orb.b{background:radial-gradient(circle,#ffb35add,#ff8a2a55 38%,transparent 66%)}
.orb.m{background:radial-gradient(circle,#7fdcffdd,#3aa8ff55 38%,transparent 66%);animation-delay:-1.5s}
@keyframes orb{50%{opacity:.4;scale:1.18}}
.ring{position:absolute;left:50%;top:44%;width:118%;aspect-ratio:1;overflow:visible;opacity:.85;pointer-events:none;
  translate:calc(-50% + var(--rx,0px)) calc(-50% + var(--ry,0px));transition:translate .4s ease-out}
.ring g{transform-box:fill-box;transform-origin:center;animation:spin 70s linear infinite}
.ring .r2{animation-duration:90s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-10px)}}

.col{position:absolute;right:0;top:50%;translate:0 -50%;width:max(340px,calc(var(--sw) * .34));max-height:90vh;display:flex;flex-direction:column}
.ttl{font:700 clamp(2rem,4.2vw,3.3rem)/1.05 var(--serif);text-shadow:0 0 28px #8f9bffaa,0 2px 0 #0006}
.role{font:700 12.5px var(--ui);color:var(--gold);letter-spacing:.5em;text-transform:uppercase;margin:8px 0 14px}
.line{height:14px;flex:none;position:relative;background:linear-gradient(90deg,transparent,#e9c77999 18%,#e9c779 50%,#e9c77999 82%,transparent) center/100% 1px no-repeat}
.line::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;translate:-50% -50%;rotate:45deg;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.body{flex:0 1 auto;min-height:0;overflow:auto;max-height:calc(90vh - 240px);padding:20px 6px 12px 0;scrollbar-width:thin}
.menu button,.box{display:block;width:100%;margin-bottom:13px;padding:12px 20px;text-align:left;text-decoration:none;font:700 1rem var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
  border:1px solid #e9c77988;background:linear-gradient(180deg,#171c52cc,#0c1036cc);box-shadow:inset 0 0 0 3px #0c1036,inset 0 0 0 4px #e9c77933;backdrop-filter:blur(4px);
  transition:transform .2s,border-color .2s,box-shadow .2s,color .2s;animation:in .5s both}
.menu button::before,.box::before{content:"";display:inline-block;width:7px;height:7px;rotate:45deg;margin-right:14px;background:var(--mute);vertical-align:middle;transition:background .2s}
.menu button:hover,.menu button:focus-visible,.box:hover{transform:translateX(8px);border-color:var(--gold);color:#fff;
  box-shadow:inset 0 0 0 3px #0c1036,inset 0 0 0 4px #e9c77966,0 0 24px #e9c77744}
.menu button:hover::before,.box:hover::before{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.menu button:nth-child(2){animation-delay:.07s}.menu button:nth-child(3){animation-delay:.14s}.menu button:nth-child(4){animation-delay:.21s}
@keyframes in{from{opacity:0;transform:translateX(24px)}}
.h2{font:700 1.35rem var(--serif);margin-bottom:14px;color:var(--gold);letter-spacing:.06em}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{text-align:left;animation:in .5s both}
.th{display:block;aspect-ratio:16/10;position:relative;border:1px solid #e9c77977;
  background:var(--i,none) center/cover,linear-gradient(135deg,var(--a),var(--b));transition:border-color .2s,box-shadow .2s}
.th::before{content:"";position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;border:1.5px solid #fff;border-radius:50%;background:#0007}
.th::after{content:"";position:absolute;left:50%;top:50%;margin:-8px -5px;border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent}
.card:hover .th,.card:focus-visible .th{border-color:var(--gold);box-shadow:0 0 22px #e9c77766}
.card b{display:block;margin-top:8px;font:700 .8rem var(--ui);letter-spacing:.1em;text-transform:uppercase}
.card small{color:var(--mute);font-size:.95rem}
.txt p{color:#dde0fa;margin-bottom:14px;font-size:1.1rem}
.back{align-self:center;margin-top:10px;padding:8px 36px;font:700 .85rem var(--ui);letter-spacing:.32em;border:1px solid #e9c77999;background:#0d1236cc;
  box-shadow:inset 0 0 0 3px #0d1236,inset 0 0 0 4px #e9c77933;transition:border-color .2s,color .2s,box-shadow .2s}
.back:hover{border-color:var(--gold);color:var(--gold);box-shadow:inset 0 0 0 3px #0d1236,inset 0 0 0 4px #e9c77966,0 0 20px #e9c77744}
.soc{position:absolute;left:0;bottom:2.4vh;z-index:2;display:flex;gap:16px;font:700 .7rem var(--ui);letter-spacing:.14em}
.soc a{color:var(--mute);text-decoration:none}.soc a:hover{color:var(--gold)}

/* ===== VIDEO ===== */
dialog{border:1px solid var(--gold);padding:0;width:min(940px,92vw);background:#0b0e2c;color:var(--ink);overflow:hidden;box-shadow:0 0 70px #6f7dff44}
dialog::backdrop{background:#04051ccc;backdrop-filter:blur(4px)}
.fr{aspect-ratio:16/9;position:relative;display:grid;place-items:center;text-align:center;padding:20px;background:var(--i,none) center/cover,linear-gradient(135deg,var(--a),var(--b))}
.fr iframe,.fr video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.info{padding:14px 20px 18px}.info h3{font:700 1.3rem var(--serif);color:var(--gold)}.info p{color:var(--mute)}
.x{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border:1px solid var(--gold);background:#090b26;font-size:1rem}

@media (max-aspect-ratio:1/1){.bg{background-size:auto 125%;background-position:58% 20%}}
@media (max-width:820px){
  .scene{--sw:100vw}
  .chw{height:min(60vh,calc(92vw / var(--ar)));left:-6vw;opacity:.55}
  .col{left:22px;right:22px;width:auto;top:5vh;translate:none;max-height:90vh}
  .body{max-height:calc(90vh - 230px)}
  .cards{grid-template-columns:1fr}
  .soc{display:none}
}
@media (prefers-reduced-motion:reduce){.stage,.pl,.lobby{transition:none}.hot,.bob,.orb,.ring g{animation:none}}
</style>
</head>
<body>

<div class="room" id="room">
  <div class="stage" id="stage"><div class="pl" id="pl">
    <img data-img="room" alt="Kamar animator di malam hari dengan monitor menyala di tengah meja">
    <canvas class="sky" id="rsky" aria-hidden="true"></canvas>
    <button class="hot" id="hot" aria-label="Klik monitor untuk masuk ke portofolio"><span class="scr"><b>Enter</b></span></button>
  </div></div>
  <div class="cap">TRI WIBOWO · 3D ANIMATOR<small>klik monitor untuk masuk</small></div>
</div>

<div class="lobby" id="lobby" aria-hidden="true">
  <div class="bg"></div><canvas class="stars" id="lsky" aria-hidden="true"></canvas>
  <div class="fog"></div>
  <div class="scene">
  <div class="chw" style="--ar:.9074"><div class="glow"></div>
    <svg class="ring" viewBox="0 0 400 400" aria-hidden="true"><g class="r1"><circle cx="200" cy="200" r="192" fill="none" stroke="#9fb0ff" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 7"/><circle cx="200" cy="200" r="172" fill="none" stroke="#c9d2ff" stroke-opacity=".6" stroke-width="2"/><circle cx="200" cy="200" r="156" fill="none" stroke="#ffc477" stroke-opacity=".7" stroke-width="7" stroke-dasharray="2 14.3"/></g><g class="r2"><path d="M200 62 321 270H79ZM200 338 79 130H321Z" fill="none" stroke="#8fe0ff" stroke-opacity=".6" stroke-width="1.6"/></g></svg>
    <div class="bob"><img data-img="chr" alt="Karakter penyihir berjubah biru yang memegang logo Blender dan Maya">
      <i class="orb b" style="left:15.4%;top:27.4%"></i><i class="orb m" style="left:85.9%;top:33%"></i></div>
  </div>
  <div class="col">
    <h1 class="ttl" id="nm"></h1><div class="role">3D Animator</div><div class="line"></div>
    <div class="body" id="body"></div>
    <div class="line"></div><button class="back" id="back">EXIT</button>
  </div>
  <div class="soc" id="soc"></div>
  </div>
</div>

<dialog id="box"><button class="x" aria-label="Tutup">✕</button><div class="fr" id="fr"></div><div class="info" id="info"></div></dialog>

<script>
/* ===== EDIT DI SINI =====
   video : link embed YouTube/Vimeo (https://www.youtube.com/embed/KODE) atau file (videos/nama.mp4)
   thumb : gambar sampul opsional (mis. thumbs/karya1.jpg) */
var ME={name:'Tri Wibowo',email:'email@kamu.com',
  bio:['Halo, aku Tri Wibowo, 3D animator berbasis di Indonesia. Aku suka detail kecil yang bikin gerakan terasa hidup: berat badan, timing, dan akting karakter.','Tulis perjalananmu, pengalaman kerja, atau studio tempat kamu pernah bekerja di sini.'],
  tools:['Blender','Maya','Cinema 4D','After Effects','Substance Painter','Unreal Engine'],
  links:[['Instagram','https://www.instagram.com/'],['ArtStation','https://www.artstation.com/'],['YouTube','https://www.youtube.com/']]};
var WORKS=[
 {t:'Judul Proyek Satu',cat:'Animasi karakter',sw:'Blender',yr:'2026',desc:'Deskripsi singkat proyek: ceritanya, perananmu, dan tantangan teknisnya.',video:'',thumb:'',a:'#2f4bff',b:'#8a6bff'},
 {t:'Walk Cycle',cat:'Rigging dan animasi',sw:'Maya',yr:'2026',desc:'Siklus jalan karakter dengan fokus pada berat dan ritme.',video:'',thumb:'',a:'#ff4fd8',b:'#8a6bff'},
 {t:'Product Reveal',cat:'Motion graphics',sw:'Cinema 4D',yr:'2025',desc:'Animasi pengungkapan produk untuk iklan.',video:'',thumb:'',a:'#0b1230',b:'#3a56d4'},
 {t:'Short Film',cat:'Cinematic',sw:'Blender',yr:'2025',desc:'Film pendek dari storyboard sampai render akhir.',video:'',thumb:'',a:'#0fb5c9',b:'#2f4bff'},
 {t:'Creature Run',cat:'Animasi kreatur',sw:'Maya',yr:'2025',desc:'Animasi lari kreatur berkaki empat.',video:'',thumb:'',a:'#6a3cff',b:'#ff4fd8'},
 {t:'Loop Pendek',cat:'Motion loop',sw:'Blender',yr:'2024',desc:'Loop pendek yang mulus untuk media sosial.',video:'',thumb:'',a:'#1b2a6b',b:'#5ef0ff'}];
/* ========================= */

var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var still=matchMedia('(prefers-reduced-motion: reduce)').matches;
var room=$('room'),stage=$('stage'),pl=$('pl'),lobby=$('lobby'),body=$('body'),view='menu',busy=false;

/* bintang berkelip + bintang jatuh */
function sky(cv,n,avoid){
  var c=cv.getContext('2d'),W,H,d,S=[],sh=null,run=false,nx=0;
  function rs(){d=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d}
  for(var i=0;i<n;i++){var x;do{x=Math.random()}while(avoid&&x>avoid[0]&&x<avoid[1]);S.push({x:x,y:Math.random(),r:.5+Math.random()*1.1,p:Math.random()*6.3,s:still?0:.6+Math.random()*1.6})}
  function shoot(){sh={x:.25+Math.random()*.7,y:Math.random()*.35,t:0}}
  function loop(ts){
    if(!run)return;
    c.setTransform(d,0,0,d,0,0);c.clearRect(0,0,W,H);c.fillStyle='#dfe6ff';
    S.forEach(function(s){c.globalAlpha=.35+.65*Math.abs(Math.sin(ts/1000*s.s+s.p));c.beginPath();c.arc(s.x*W,s.y*H,s.r,0,6.3);c.fill()});
    c.globalAlpha=1;
    
    if(sh){sh.t+=.022;var hx=(sh.x-sh.t*.4)*W,hy=(sh.y+sh.t*.18)*H,g=c.createLinearGradient(hx,hy,hx+90,hy-40);
      g.addColorStop(0,'rgba(255,255,255,'+(1-sh.t)+')');g.addColorStop(1,'rgba(255,255,255,0)');
      c.strokeStyle=g;c.lineWidth=1.8;c.beginPath();c.moveTo(hx,hy);c.lineTo(hx+90,hy-40);c.stroke();if(sh.t>=1)sh=null}
    if(still)run=false;else requestAnimationFrame(loop);
  }
  addEventListener('resize',function(){if(run)rs()});
  return{start:function(){if(run)return;run=true;rs();nx=performance.now()+3000;requestAnimationFrame(loop)},stop:function(){run=false},shoot:shoot};
}
var roomSky=sky($('rsky'),34,[.42,.485]),lobbySky=sky($('lsky'),140,false);
roomSky.start();

room.addEventListener('pointermove',function(e){
  if(busy||lobby.classList.contains('on'))return;
  pl.style.setProperty('--px',((e.clientX/innerWidth-.5)*-16)+'px');pl.style.setProperty('--py',((e.clientY/innerHeight-.5)*-10)+'px')});

/* tata letak: gambar web (landscape) / HP (portrait), monitor selalu di tengah layar */
var VIEWS={
 d:{k:'d',ar:1193/751,hot:[.4082,.4354,.2666,.2463],scr:[.0157,.0270,.9654,.9135],sky:[.3495,.0759,.4275,.3595],avoid:[.42,.485]},
 m:{k:'m',ar:367/774,hot:[.1362,.5685,.5940,.1796],scr:[.0229,.0432,.9587,.8849],sky:[.1362,.0904,.6948,.478],avoid:[.48,.57]}};
var view=null;
function box(e,a){e.style.left=a[0]*100+'%';e.style.top=a[1]*100+'%';e.style.width=a[2]*100+'%';e.style.height=a[3]*100+'%'}
function applyView(v){
  pl.querySelector('img').src=v.k==='m'?IMG.roomM:IMG.room;
  box($('hot'),v.hot);box($('hot').querySelector('.scr'),v.scr);box($('rsky'),v.sky);
  roomSky.stop();roomSky=sky($('rsky'),34,v.avoid);if(!lobby.classList.contains('on'))roomSky.start();
}
function layout(){
  var vw=innerWidth,vh=innerHeight,v=innerWidth<innerHeight?VIEWS.m:VIEWS.d;
  if(v!==view){view=v;applyView(v)}
  var cx=v.hot[0]+v.hot[2]/2,w=Math.max(vw,vh*v.ar,vw/(2*Math.min(cx,1-cx))),h=w/v.ar,st=stage.style;
  st.width=w+'px';st.height=h+'px';st.left=(vw/2-cx*w)+'px';st.top=((vh-h)/2)+'px';
}

/* masuk / keluar */
function enter(){
  busy=true;room.classList.add('go');pl.style.setProperty('--px','0px');pl.style.setProperty('--py','0px');
  var v=view,r=stage.getBoundingClientRect(),w=r.width,h=r.height,cx=v.hot[0]+v.hot[2]/2,cy=v.hot[1]+v.hot[3]/2,
    s=Math.max(innerWidth/(w*v.hot[2]),innerHeight/(h*v.hot[3]))*1.04;
  stage.style.transformOrigin=cx*100+'% '+cy*100+'%';
  stage.style.transform='translate('+(innerWidth/2-(r.left+cx*w))+'px,'+(innerHeight/2-(r.top+cy*h))+'px) scale('+s+')';
  stage.classList.add('zoom');room.classList.add('in');
  setTimeout(function(){show('menu');lobby.classList.add('on');lobby.removeAttribute('aria-hidden');lobbySky.start();roomSky.stop();
    var f=body.querySelector('button');if(f)f.focus()},800);
}
function leave(){
  lobby.classList.remove('on');lobby.setAttribute('aria-hidden','true');
  setTimeout(function(){stage.style.transform='';stage.classList.remove('zoom');room.classList.remove('in');roomSky.start();lobbySky.stop();busy=false;$('hot').focus();setTimeout(function(){room.classList.remove('go')},1100)},400);
}
$('hot').onclick=enter;
function back(){if(view!=='menu')show('menu');else leave()}
$('back').onclick=back;
addEventListener('keydown',function(e){if(e.key==='Escape'&&lobby.classList.contains('on')&&!$('box').open)back()});

lobby.addEventListener('pointermove',function(e){var x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5,st=lobby.style;
  st.setProperty('--lx',x*-14+'px');st.setProperty('--ly',y*-8+'px');st.setProperty('--rx',x*28+'px');st.setProperty('--ry',y*16+'px')});

/* isi lobby */
$('nm').textContent=ME.name;
$('soc').innerHTML=ME.links.map(function(l){return'<a href="'+esc(l[1])+'" target="_blank" rel="noopener">'+esc(l[0])+'</a>'}).join('');
function show(v){
  view=v;var h='';
  if(v==='menu'){
    h='<nav class="menu" aria-label="Menu utama">'+['animation','tools','about','contact'].map(function(m){return'<button data-go="'+m+'">'+m+'</button>'}).join('')+'</nav>';
  }else if(v==='animation'){
    h='<h2 class="h2">animation</h2><div class="cards">'+WORKS.map(function(w,i){
      return'<button class="card" data-w="'+i+'" style="--a:'+w.a+';--b:'+w.b+(w.thumb?";--i:url('"+esc(w.thumb)+"')":'')+';animation-delay:'+i*.06+'s"><span class="th"></span><b>'+esc(w.t)+'</b><small>'+esc(w.cat)+' · '+esc(w.sw)+'</small></button>'}).join('')+'</div>';
  }else if(v==='tools'){
    h='<h2 class="h2">tools</h2><div class="txt">'+ME.tools.map(function(t){return'<div class="box" style="animation-delay:'+Math.random()*.2+'s">'+esc(t)+'</div>'}).join('')+'</div>';
  }else if(v==='about'){
    h='<h2 class="h2">about</h2><div class="txt">'+ME.bio.map(function(p){return'<p>'+esc(p)+'</p>'}).join('')+'</div>';
  }else{
    h='<h2 class="h2">contact</h2><div class="txt"><a class="box" href="mailto:'+esc(ME.email)+'">'+esc(ME.email)+'</a>'+ME.links.map(function(l){return'<a class="box" href="'+esc(l[1])+'" target="_blank" rel="noopener">'+esc(l[0])+'</a>'}).join('')+'</div>';
  }
  body.innerHTML=h;body.scrollTop=0;$('back').textContent=v==='menu'?'EXIT':'BACK';
}
body.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]'),w=e.target.closest('[data-w]');
  if(g){show(g.dataset.go);var f=body.querySelector('.card,.box');if(f&&f.focus)f.focus({preventScroll:true})}
  else if(w)openWork(+w.dataset.w);
});

/* pemutar video */
var dlg=$('box'),fr=$('fr');
function openWork(i){
  var w=WORKS[i],s=w.video;
  fr.style.cssText='--a:'+w.a+';--b:'+w.b+(w.thumb?";--i:url('"+w.thumb+"')":'');
  if(!s)fr.textContent='Video belum ditambahkan. Isi "video" di index.html.';
  else if(/\.(mp4|webm)$/i.test(s))fr.innerHTML='<video src="'+esc(s)+'" controls autoplay></video>';
  else fr.innerHTML='<iframe src="'+esc(s)+'" title="'+esc(w.t)+'" allow="autoplay; fullscreen" allowfullscreen></iframe>';
  $('info').innerHTML='<h3>'+esc(w.t)+'</h3><p>'+esc(w.cat)+' · '+esc(w.sw)+' · '+esc(w.yr)+'</p><p style="margin-top:6px;color:var(--ink)">'+esc(w.desc)+'</p>';
  dlg.showModal();
}
function closeW(){fr.innerHTML='';dlg.close()}
dlg.querySelector('.x').onclick=closeW;
dlg.addEventListener('click',function(e){if(e.target===dlg)closeW()});
dlg.addEventListener('cancel',function(){fr.innerHTML=''});
</script>
